name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Formatação
        run: terraform -chdir=terraform fmt -check -recursive

      # -backend=false: o CI valida a sintaxe sem precisar das credenciais da AWS.
      - name: Init sem backend
        run: terraform -chdir=terraform init -backend=false -input=false

      - name: Validate
        run: terraform -chdir=terraform validate
